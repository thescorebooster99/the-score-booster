

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard - The SCORE Booster</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px}
.box{max-width:450px;margin:30px auto;background:white;padding:22px;border-radius:12px}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;font-size:16px}
button{background:#123c69;color:white;border:0;border-radius:6px}
h2{text-align:center;color:#123c69}
#dashboard{display:none}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
<h2>The SCORE Booster</h2>
<h3>Admin Login</h3>

<div id="login">
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Admin Password">
<button onclick="adminLogin()">Login</button>
</div>

<div id="dashboard">
<h3>Access Code Generator</h3>
<input id="studentName" placeholder="Student Name">
<input id="days" type="number" value="30" min="1" max="365">
<button onclick="createCode()">Generate Access Code</button>
<button onclick="logout()">Logout</button>
</div>

<p id="message"></p>
<div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

<script>
async function adminLogin(){
 const msg=document.getElementById("message");
 msg.textContent="Checking...";
 try{
  const {data,error}=await window.sb.auth.signInWithPassword({
   email:document.getElementById("email").value.trim(),
   password:document.getElementById("password").value
  });
  if(error) throw error;

  const {data:isAdmin,error:adminError}=await window.sb.rpc("is_admin");
  if(adminError) throw adminError;

  if(!isAdmin){
   await window.sb.auth.signOut();
   throw new Error("Admin permission denied");
  }

  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";
  document.getElementById("adminSections").style.display="block";
  msg.textContent="Admin login successful.";
 }catch(e){
  msg.textContent="Error: "+e.message;
 }
}

async function createCode(){
 const msg=document.getElementById("message");
 const result=document.getElementById("result");
 msg.textContent="Generating...";
 result.textContent="";

 try{
  const name=document.getElementById("studentName").value.trim();
  const days=Number(document.getElementById("days").value);

  if(!name || !Number.isInteger(days) || days<1 || days>365)
   throw new Error("Enter a student name and validity from 1 to 365 days.");

  const {data,error}=await window.sb.rpc("admin_create_access_code",{
   p_student_name:name,
   p_valid_days:days
  });

  if(error) throw error;
  if(!data || !data.success) throw new Error(data?.message || "Code creation failed.");

  result.innerHTML="";
  const heading=document.createElement("h3");
  heading.textContent="Code Created Successfully";
  const code=document.createElement("p");
  code.textContent="Access Code: "+data.access_code;
  const student=document.createElement("p");
  student.textContent="Student Code: "+data.student_code;
  result.append(heading,code,student);

  msg.textContent="Save this code and give it to the student.";
 }catch(e){
  msg.textContent="Error: "+e.message;
 }
}

async function logout(){
 await window.sb.auth.signOut();
 location.reload();
}
</script>
 <div id="adminSections" style="display:none;">
 <hr>
<h3>MCQ Exam Management</h3>

<input id="examTitle" placeholder="Exam Title">

<select id="questionLimit">
  <option value="50">50 Questions - 25 Minutes</option>
  <option value="100">100 Questions - 50 Minutes</option>
</select>

<button onclick="createExam()">Create Exam</button>

<p id="examMessage"></p>

<script>
async function createExam(){
 const title=document.getElementById("examTitle").value.trim();
 const limit=Number(document.getElementById("questionLimit").value);
 const msg=document.getElementById("examMessage");

 if(!title){
  msg.textContent="Please enter Exam Title.";
  return;
 }

 msg.textContent="Creating Exam...";

 try{
  const {data,error}=await window.sb.rpc("admin_create_exam", {
   p_title:title,
   p_question_limit:limit
  });

  if(error) throw error;

  if(!data || !data.success){
   throw new Error(data?.message || "Exam creation failed.");
  }

  msg.textContent=
   "Exam created successfully! Exam ID: "+data.exam_id+
   " | "+data.question_limit+" questions"+
   " | "+data.duration_minutes+" minutes";

 }catch(e){
  msg.textContent="Error: "+e.message;
 }
}
</script>
 
<hr>
<h2>MCQ Question Management</h2>

<label>Exam ID</label>
<input id="questionExamId" placeholder="Paste Exam ID">
<label>Subject</label>
<select id="questionSubject">
 <option value="biology">Biology</option>
  <option value="chemistry">Chemistry</option>
  <option value="physics">Physics</option>
  <option value="english">English</option>
  <option value="general_knowledge">General Knowledge</option>
</select>
<label>Question</label>
<textarea id="questionText" placeholder="Write your question"></textarea>

<label>Option A</label>
<input id="optionA" placeholder="Option A">

<label>Option B</label>
<input id="optionB" placeholder="Option B">

<label>Option C</label>
<input id="optionC" placeholder="Option C">

<label>Option D</label>
<input id="optionD" placeholder="Option D">

<label>Correct Answer</label>
<select id="correctOption">
<option value="1">Option A</option>
<option value="2">Option B</option>
<option value="3">Option C</option>
<option value="4">Option D</option>
</select>

<label>Explanation</label>
<textarea id="questionExplanation" placeholder="Write explanation"></textarea>

<button onclick="addQuestion()">Add Question</button>
<p id="questionMessage"></p>

<script>
async function addQuestion(){
 const msg=document.getElementById("questionMessage");
 const examId=document.getElementById("questionExamId").value.trim();
 const question=document.getElementById("questionText").value.trim();

 const options=[
 document.getElementById("optionA").value.trim(),
 document.getElementById("optionB").value.trim(),
 document.getElementById("optionC").value.trim(),
 document.getElementById("optionD").value.trim()
 ];

 const correct=Number(document.getElementById("correctOption").value);
 const subject=document.getElementById("questionSubject").value;
 const explanation=document.getElementById("questionExplanation").value.trim();

 if(!examId || !question || options.some(x=>!x)){
 msg.textContent="Please fill all required fields.";
 return;
 }

 msg.textContent="Adding question...";

 try{
 const {data,error}=await window.sb.rpc("admin_add_question",{
 p_exam_id:examId,
 p_question_text:question,
 p_options:options,
 p_correct_option:correct,
p_subject:subject,
p_explanation:explanation || null
 });

 if(error) throw error;

 msg.textContent="Question added successfully!";

 document.getElementById("questionText").value="";
  document.getElementById("questionSubject").value="biology";
 document.getElementById("optionA").value="";
 document.getElementById("optionB").value="";
 document.getElementById("optionC").value="";
 document.getElementById("optionD").value="";
 document.getElementById("questionExplanation").value="";

 }catch(e){
 msg.textContent="Error: "+e.message;
 }
}
</script>
<hr>
<h2>Bulk MCQ Import</h2>

<p>Exam ID:</p>
<input id="bulkExamId" placeholder="Enter Exam ID">
<p>Upload JSON File:</p>
<input
  type="file"
  id="bulkFile"
  accept=".json,application/json"
>
<button onclick="loadBulkFile()">Load JSON File</button>
<p>MCQ JSON:</p>
<textarea id="bulkQuestions" rows="12"
placeholder="Paste MCQ JSON here"
style="width:100%;"></textarea>

<br><br>
<button onclick="importQuestions()">Import Questions</button>

<p id="bulkMessage"></p>

<hr>
<h2>Subject-wise Question Counter</h2>

<label>Exam ID:</label>
<input
  id="countExamId"
  placeholder="Enter Exam UUID"
>

<button onclick="loadSubjectCounts()">
  Check Question Count
</button>

<div id="subjectCountResult"></div>

<script>
async function loadSubjectCounts() {
  const examId = document.getElementById("countExamId").value.trim();
  const result = document.getElementById("subjectCountResult");

  if (!examId) {
    result.textContent = "Please enter Exam ID.";
    return;
  }

  result.textContent = "Loading question counts...";

  try {
    const { data, error } = await window.sb.rpc(
      "admin_get_exam_subject_counts",
      { p_exam_id: examId }
    );

    if (error) throw error;

    result.innerHTML = `
      <h3>Question Summary</h3>
      <p>Biology: ${data.biology}</p>
      <p>Chemistry: ${data.chemistry}</p>
      <p>Physics: ${data.physics}</p>
      <p>English: ${data.english}</p>
      <p>General Knowledge: ${data.general_knowledge}</p>
      <hr>
      <h3>Total Questions: ${data.total}</h3>
    `;

  } catch (e) {
    result.textContent = "Error: " + e.message;
  }
}

async function importQuestions() {
  const examId = document.getElementById("bulkExamId").value.trim();
  const raw = document.getElementById("bulkQuestions").value.trim();
  const msg = document.getElementById("bulkMessage");

  if (!examId || !raw) {
    msg.textContent = "Exam ID and MCQ JSON required.";
    return;
  }

  try {
    const questions = JSON.parse(raw);

    msg.textContent = "Importing...";

    const { data, error } = await window.sb.rpc(
      "admin_add_questions_bulk",
      {
        p_exam_id: examId,
        p_questions: questions
      }
    );

    if (error) throw error;

    msg.textContent = "Success! " +
      data.questions_added + " questions added.";

  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
}
 async function loadBulkFile() {
  const file = document.getElementById("bulkFile").files[0];
  const msg = document.getElementById("bulkMessage");

  if (!file) {
    msg.textContent = "Please select a JSON file.";
    return;
  }

  try {
    const raw = await file.text();
    const questions = JSON.parse(raw);

    if (!Array.isArray(questions)) {
      throw new Error("Invalid JSON format.");
    }

    document.getElementById("bulkQuestions").value =
      JSON.stringify(questions);

    msg.textContent =
      questions.length + " questions loaded. Now click Import Questions.";

  } catch (e) {
    msg.textContent = "File error: " + e.message;
  }
}
</script>
 <hr>
<h2>Publish Exam</h2>

<input
  id="publishExamId"
  placeholder="Enter Exam UUID"
  style="width:100%; padding:10px;"
>

<br><br>

<button onclick="publishExam()">
  Publish Exam
</button>

<p id="publishMessage"></p>

<script>
async function publishExam() {
  const examId =
    document.getElementById("publishExamId").value.trim();

  const msg =
    document.getElementById("publishMessage");

  if (!examId) {
    msg.textContent = "Please enter Exam ID.";
    return;
  }

  msg.textContent = "Checking and publishing...";

  try {
    const { data, error } = await window.sb.rpc(
      "admin_publish_exam",
      { p_exam_id: examId }
    );

    if (error) throw error;

    msg.textContent =
      data.message || "Exam published successfully!";

  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
}
</script>
 <hr>
<h2>Exam Schedule Control</h2>

<label>Exam ID:</label>
<input
  id="scheduleExamId"
  placeholder="Enter Exam UUID"
  style="width:100%;padding:10px;"
>

<br><br>

<label>Exam Start Date & Time:</label>
<input type="datetime-local"
id="examStart"
style="width:100%;padding:10px;">

<br><br>

<label>Exam End Date & Time:</label>
<input type="datetime-local"
id="examEnd"
style="width:100%;padding:10px;">

<br><br>

<button onclick="saveExamSchedule()">
Save Exam Schedule
</button>

<p id="scheduleMessage"></p>

<script>
async function saveExamSchedule() {
  const examId = document.getElementById("scheduleExamId").value.trim();
  const start = document.getElementById("examStart").value;
  const end = document.getElementById("examEnd").value;
  const msg = document.getElementById("scheduleMessage");

  if (!examId || !start || !end) {
    msg.textContent = "Please fill all fields.";
    return;
  }

  if (new Date(end) <= new Date(start)) {
    msg.textContent = "End time must be after start time.";
    return;
  }

  msg.textContent = "Saving schedule...";

  try {
    const { data, error } = await window.sb.rpc(
      "admin_set_exam_schedule",
      {
        p_exam_id: examId,
        p_start_at: new Date(start).toISOString(),
        p_end_at: new Date(end).toISOString()
      }
    );

    if (error) throw error;

    msg.textContent = data.message || "Schedule saved successfully!";

  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
}
</script>
  <hr>
<h2>Free PDF Library Management</h2>

<label>PDF Title:</label>
<input id="freePdfTitle" placeholder="Enter PDF Name">

<label>Select PDF:</label>
<input type="file" id="freePdfFile" accept="application/pdf">

<button onclick="uploadFreePDF()">Upload PDF</button>

<p id="freePdfMessage"></p>

<hr>
<h3>Uploaded Free PDFs</h3>
<button onclick="loadFreePDFs()">Refresh PDF List</button>

<script>
async function uploadFreePDF() {
  const msg = document.getElementById("freePdfMessage");
  const title = document.getElementById("freePdfTitle").value.trim();
  const file = document.getElementById("freePdfFile").files[0];

  try {
    if (!title || !file) {
      throw new Error("PDF name and file are required.");
    }

    if (file.type !== "application/pdf") {
      throw new Error("Only PDF files are allowed.");
    }

    if (file.size > 50 * 1024 * 1024) {
      throw new Error("PDF must be under 50 MB.");
    }

    const { data: { user }, error: userError } =
      await window.sb.auth.getUser();

    if (userError || !user) {
      throw new Error("Please login as admin first.");
    }

    const { data: isAdmin, error: adminError } =
      await window.sb.rpc("is_admin");

    if (adminError || !isAdmin) {
      throw new Error("Admin permission required.");
    }

    const safeTitle = title
      .replace(/[^a-zA-Z0-9-_ ]/g, "")
      .trim()
      .replace(/\s+/g, "-")
      .slice(0, 60);

    if (!safeTitle) {
      throw new Error("Please enter a valid PDF title.");
    }

    const filePath =
      Date.now() + "-" + safeTitle + ".pdf";

    msg.textContent = "Uploading PDF...";

    const { error } = await window.sb.storage
      .from("free-resources")
      .upload(filePath, file, {
        contentType: "application/pdf",
        upsert: false
      });

    if (error) throw error;

    msg.textContent = "PDF uploaded successfully!";

    document.getElementById("freePdfTitle").value = "";
    document.getElementById("freePdfFile").value = "";

    await loadFreePDFs();

  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
}


async function loadFreePDFs() {
  const area = document.getElementById("freePdfList");
  area.textContent = "Loading PDFs...";

  try {
    const { data, error } = await window.sb.functions.invoke(
      "free-pdf-reader",
      { body: { action: "list" } }
    );

    if (error) throw error;
    if (!data || !data.success) {
      throw new Error(data?.error || "Could not load PDFs.");
    }

    area.innerHTML = "";

    if (!data.files.length) {
      area.textContent = "No PDFs uploaded yet.";
      return;
    }

    data.files.forEach(file => {
      const item = document.createElement("div");
      item.style.padding = "12px";
      item.style.margin = "8px 0";
      item.style.background = "#f1f5f9";
      item.style.borderRadius = "8px";

      const name = document.createElement("p");
      name.textContent = file.name;

      const del = document.createElement("button");
      del.textContent = "Delete PDF";
      del.style.background = "#dc2626";

      del.onclick = () => deleteFreePDF(file.path);

      item.append(name, del);
      area.appendChild(item);
    });

  } catch (e) {
    area.textContent = "Error: " + e.message;
  }
}


async function deleteFreePDF(path) {
  if (!confirm("Are you sure you want to delete this PDF?")) {
    return;
  }

  const msg = document.getElementById("freePdfMessage");

  try {
    const { data: { user }, error: userError } =
      await window.sb.auth.getUser();

    if (userError || !user) {
      throw new Error("Admin login required.");
    }

    const { data: isAdmin, error: adminError } =
      await window.sb.rpc("is_admin");

    if (adminError || !isAdmin) {
      throw new Error("Admin permission required.");
    }

    const { error } = await window.sb.storage
      .from("free-resources")
      .remove([path]);

    if (error) throw error;

    msg.textContent = "PDF deleted successfully!";
    await loadFreePDFs();

  } catch (e) {
    msg.textContent = "Error: " + e.message;
  }
}
</script>

<div id="freePdfList"></div>
</div>
</body>
</html>
