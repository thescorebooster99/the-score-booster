
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard - The SCORE Booster</title>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:20px}
.box{max-width:600px;margin:25px auto;background:white;padding:22px;border-radius:12px}
h2{text-align:center;color:#123c69}
button{width:100%;padding:14px;margin:10px 0;background:#123c69;color:white;border:0;border-radius:7px;font-size:16px}
#message{text-align:center}
iframe{width:100%;height:600px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="box">
<h2>The SCORE Booster</h2>
<h3>Student Dashboard</h3>
<p id="message">Checking student access...</p>

<div id="dashboard" style="display:none">
<button onclick="openBook()">📚 Read PDF Book</button>
<div id="book"></div>
<button onclick="logout()">Logout</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>

<script>
async function checkAccess(){
 try{
  const {data:sessionData}=await window.sb.auth.getSession();

  if(!sessionData.session){
   throw new Error("Please login first.");
  }

  const {data,error}=await window.sb.rpc("get_my_student_profile");
  if(error) throw error;
  if(!data) throw new Error("Student access not found.");

  document.getElementById("message").textContent="Welcome to The SCORE Booster!";
  document.getElementById("dashboard").style.display="block";

 }catch(e){
  document.getElementById("message").textContent=e.message;
 }
}

async function openBook(){
 const book=document.getElementById("book");
 book.innerHTML="Loading PDF...";

 try{
  const {data,error}=await window.sb.storage
   .from("digital-books")
   .createSignedUrl("admission-guide.pdf",3600);

  if(error) throw error;

  book.innerHTML="";
  const frame=document.createElement("iframe");
  frame.src=data.signedUrl;
  book.appendChild(frame);

 }catch(e){
  book.textContent="PDF Error: "+e.message;
 }
}

async function logout(){
 await window.sb.auth.signOut();
 location.href="login.html";
}

checkAccess();
</script>
</body>
</html>
